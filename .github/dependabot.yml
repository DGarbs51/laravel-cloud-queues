version: 2
updates:
  # Also bumps SHA-pinned actions (setup-uv) and their `# vX.Y.Z` comments.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directories: [/, /probe-app]
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
