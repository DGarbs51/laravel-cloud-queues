name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  UV_LOCKED: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - name: ruff check / format --check
        run: |
          set -euo pipefail
          # Code roots only (matches [tool.ruff] src in pyproject.toml), not
          # docs: ruff >=0.16 also formats fenced ```python
          # blocks inside Markdown, and pre-existing prose in those files trips it.
          targets=()
          for dir in src tests .github/scripts scripts; do
            [ -d "$dir" ] && targets+=("$dir")
          done
          uv run ruff check "${targets[@]}"
          uv run ruff format --check "${targets[@]}"
      # actionlint via the PyPI wrapper (downloads the Go binary from its GitHub
      # release at build time) rather than a system/brew install.
      - run: uvx --from actionlint-py actionlint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.11"
      - run: uv sync --locked
      # ty on src and tests/harness (pyproject.toml [tool.ty]); the downstream typing
      # samples (tests/typing/) are exercised inside the `test` job's pytest run.
      - run: uv run ty check
      # mypy --strict and pyright strict over the shipped package ([tool.mypy]/[tool.pyright]).
      - run: uv run mypy
      - run: uv run pyright
      # Public API type completeness: must stay at 100%.
      - run: uv run pyright --verifytypes laravel_cloud_queues --ignoreexternal

  test:
    # Laravel Cloud runs Python on Debian 12 (bookworm) arm64 with CPython under
    # /usr/local, i.e. the python:<version>-slim-bookworm lineage. Test steps run in
    # that public image on an arm64 runner (.github/scripts/cloud-python.sh).
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      CLOUD_PYTHON_IMAGE: python:${{ matrix.python-version }}-slim-bookworm
      LARAVEL_CLOUD_QUEUES_REQUIRE_SERVICES: "1"
      LARAVEL_CLOUD_QUEUES_TEST_SQS: localstack
      LARAVEL_CLOUD_QUEUES_TEST_SQS_ENDPOINT: http://localhost:4566
      LARAVEL_CLOUD_QUEUES_TEST_REDIS_URL: redis://localhost:6379/15
      LARAVEL_CLOUD_QUEUES_TEST_REDIS_TLS_URL: >-
        rediss://localhost:6380/0?ssl_ca_certs=${{ github.workspace }}/.ci-tls/ca.crt
    services:
      # Pinned to 4.14.0: the last LocalStack image that starts SQS without a
      # LOCALSTACK_AUTH_TOKEN. Starting with the 2026.03.0 (2026-03-23) release,
      # LocalStack switched to calendar versioning and unified the community/Pro
      # images, and an auth token (or CI auth token) became required just to start
      # the container at all — see
      # https://blog.localstack.cloud/localstack-for-aws-release-2026-03-0/ and
      # https://github.com/testcontainers/testcontainers-java/issues/11568. 4.14.0
      # (2026-02-26) is the last semver release before that cutover and is still
      # published on Docker Hub. Revisit via .github/workflows/drift.yml / the
      # upstream-drift policy if this stops working.
      localstack:
        image: localstack/localstack:4.14.0
        ports:
          - 4566:4566
        env:
          SERVICES: sqs
        options: >-
          --health-cmd "curl -f http://localhost:4566/_localstack/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # Laravel Herd's local Valkey (used by contributors developing this repo) is
      # 8.1.8 (docs/references.md); pin CI to the same minor line.
      valkey:
        image: valkey/valkey:8.1.8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # A second, separate server so the redis-marked suite also runs against real
      # Redis (not just Valkey). Exposed on 6390 to avoid clashing with valkey/6379.
      redis:
        image: redis:8.10.2
        ports:
          - 6390:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # Without python-version the cache key has no Python version; key it per image.
          cache-suffix: ${{ env.CLOUD_PYTHON_IMAGE }}
      - name: Pull the Cloud runtime image
        run: |
          for attempt in 1 2 3; do
            docker pull --quiet "$CLOUD_PYTHON_IMAGE" && exit 0
            echo "docker pull failed (attempt $attempt)" >&2
            sleep $((attempt * 10))
          done
          exit 1
      - name: Show the runtime fingerprint
        run: >-
          .github/scripts/cloud-python.sh sh -c
          'uname -m; cat /etc/debian_version; command -v python3; python3 -VV'
      - run: .github/scripts/cloud-python.sh uv sync --locked

      - name: Generate self-signed TLS certs for the TLS Valkey container
        run: |
          set -euo pipefail
          mkdir -p .ci-tls
          # Python 3.13+ enables VERIFY_X509_STRICT: the CA needs basicConstraints
          # and keyUsage, and the leaf needs a SAN (hostname checks ignore CN).
          printf '%s\n' \
            "subjectAltName=DNS:localhost,IP:127.0.0.1" \
            "basicConstraints=critical,CA:FALSE" \
            "keyUsage=critical,digitalSignature,keyEncipherment" \
            "extendedKeyUsage=serverAuth" \
            "subjectKeyIdentifier=hash" \
            "authorityKeyIdentifier=keyid,issuer" > .ci-tls/server.ext
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout .ci-tls/ca.key -out .ci-tls/ca.crt \
            -subj "/CN=laravel-cloud-queues-test-ca" \
            -addext "basicConstraints=critical,CA:TRUE" \
            -addext "keyUsage=critical,keyCertSign,cRLSign" \
            -addext "subjectKeyIdentifier=hash"
          openssl req -newkey rsa:2048 -nodes \
            -keyout .ci-tls/server.key -out .ci-tls/server.csr \
            -subj "/CN=localhost"
          openssl x509 -req -in .ci-tls/server.csr -CA .ci-tls/ca.crt -CAkey .ci-tls/ca.key \
            -CAcreateserial -out .ci-tls/server.crt -days 1 -extfile .ci-tls/server.ext
          # The Valkey image runs as a non-root user; the throwaway test key must be
          # readable inside the container.
          chmod 0644 .ci-tls/server.key

      - name: Start a TLS-only Valkey container
        run: |
          set -euo pipefail
          # Deliberately no --tls-ca-cert-file: Valkey/Redis append it to the
          # certificate chain they present to every client (verified locally with
          # `openssl s_client`), which trips strict OpenSSL 3.x chain validation
          # with "self-signed certificate in certificate chain" (verify code 19) in
          # redis-py. --tls-auth-clients no means the server never verifies client
          # certs, so it has no need for the CA file itself.
          docker run -d --name valkey-tls \
            -p 6380:6380 \
            -v "$PWD/.ci-tls:/tls:ro" \
            valkey/valkey:8.1.8 \
            --tls-port 6380 --port 0 \
            --tls-cert-file /tls/server.crt \
            --tls-key-file /tls/server.key \
            --tls-auth-clients no

      - name: Wait for the TLS Valkey container to accept connections
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            if docker exec valkey-tls valkey-cli --tls --cacert /tls/ca.crt \
                -p 6380 ping 2>/dev/null | grep -q PONG; then
              exit 0
            fi
            sleep 1
          done
          echo "TLS Valkey never became healthy" >&2
          docker logs valkey-tls >&2 || true
          exit 1

      # LocalStack, Valkey and Redis above are `services:` containers, so GitHub
      # Actions already blocks job startup until their healthchecks pass.

      # Both runs write parallel .coverage.* data files ([tool.coverage.run]) into the
      # bind-mounted workspace; the `coverage` job combines them across the matrix.
      - name: Run the test suite (Valkey on 6379)
        run: >-
          .github/scripts/cloud-python.sh uv run coverage run -m pytest -m "not packaging"
          --junitxml=test-results/junit-${{ matrix.python-version }}.xml

      - name: Re-run redis-marked tests against real Redis (6390)
        env:
          LARAVEL_CLOUD_QUEUES_TEST_REDIS_URL: redis://localhost:6390/15
        run: >-
          .github/scripts/cloud-python.sh uv run coverage run -m pytest -m redis
          --junitxml=test-results/junit-${{ matrix.python-version }}-redis.xml

      - name: Upload coverage data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-data-${{ matrix.python-version }}
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-artifacts-${{ matrix.python-version }}
          if-no-files-found: ignore
          path: |
            test-results/**
            conformance-artifacts/**
            compatibility-report.json
            **/*.log

  coverage:
    # 100% line and branch coverage of src/laravel_cloud_queues, combined across every
    # Python version: some branches only run on specific versions, so no single job can
    # reach it alone. fail_under lives in [tool.coverage.report].
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # DeepSource matches the report to a commit: use the PR head, not the
          # temporary merge commit GitHub checks out for pull_request events.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-data-*
          merge-multiple: true
      - run: uv run coverage combine
      # Upload before the gate so DeepSource shows the missed lines when it fails.
      - run: uv run coverage xml --fail-under=0
      - name: Report coverage to DeepSource
        # Informational, not a gate: fork PRs have no secret, and a DeepSource
        # outage must not fail CI. The 100% gate is the next step.
        continue-on-error: true
        env:
          DEEPSOURCE_DSN: ${{ secrets.DEEPSOURCE_DSN }}
        run: |
          if [ -z "$DEEPSOURCE_DSN" ]; then
            echo "DEEPSOURCE_DSN is not available; skipping the DeepSource upload."
            exit 0
          fi
          curl -fsSL https://cli.deepsource.com/install | BINDIR=./bin sh
          ./bin/deepsource report --analyzer test-coverage --key python --value-file ./coverage.xml
      - run: uv run coverage report

  packaging:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      CLOUD_PYTHON_IMAGE: python:${{ matrix.python-version }}-slim-bookworm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # Without python-version the cache key has no Python version; key it per image.
          cache-suffix: ${{ env.CLOUD_PYTHON_IMAGE }}
      - name: Pull the Cloud runtime image
        run: |
          for attempt in 1 2 3; do
            docker pull --quiet "$CLOUD_PYTHON_IMAGE" && exit 0
            echo "docker pull failed (attempt $attempt)" >&2
            sleep $((attempt * 10))
          done
          exit 1
      - name: Show the runtime fingerprint
        run: >-
          .github/scripts/cloud-python.sh sh -c
          'uname -m; cat /etc/debian_version; command -v python3; python3 -VV'
      - run: .github/scripts/cloud-python.sh uv sync --locked
      - run: >-
          .github/scripts/cloud-python.sh uv run pytest -m packaging
          --junitxml=test-results/junit-packaging-${{ matrix.python-version }}.xml
      - name: twine check the built wheel and sdist
        run: |
          uv build --out-dir "$RUNNER_TEMP/dist"
          uv run --only-group release twine check --strict "$RUNNER_TEMP"/dist/*
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packaging-artifacts-${{ matrix.python-version }}
          if-no-files-found: ignore
          path: test-results/**

  conformance:
    # Cloud's default Python version.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      CLOUD_PYTHON_IMAGE: python:3.12-slim-bookworm
      LARAVEL_CLOUD_QUEUES_REQUIRE_SERVICES: "1"
      LARAVEL_CLOUD_QUEUES_TEST_SQS: localstack
      LARAVEL_CLOUD_QUEUES_TEST_SQS_ENDPOINT: http://localhost:4566
      LARAVEL_CLOUD_QUEUES_TEST_REDIS_URL: redis://localhost:6379/15
      LARAVEL_CLOUD_QUEUES_TEST_REDIS_TLS_URL: >-
        rediss://localhost:6380/0?ssl_ca_certs=${{ github.workspace }}/.ci-tls/ca.crt
    services:
      # Pinned to 4.14.0: the last LocalStack image that starts SQS without a
      # LOCALSTACK_AUTH_TOKEN. Starting with the 2026.03.0 (2026-03-23) release,
      # LocalStack switched to calendar versioning and unified the community/Pro
      # images, and an auth token (or CI auth token) became required just to start
      # the container at all — see
      # https://blog.localstack.cloud/localstack-for-aws-release-2026-03-0/ and
      # https://github.com/testcontainers/testcontainers-java/issues/11568. 4.14.0
      # (2026-02-26) is the last semver release before that cutover and is still
      # published on Docker Hub. Revisit via .github/workflows/drift.yml / the
      # upstream-drift policy if this stops working.
      localstack:
        image: localstack/localstack:4.14.0
        ports:
          - 4566:4566
        env:
          SERVICES: sqs
        options: >-
          --health-cmd "curl -f http://localhost:4566/_localstack/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # Laravel Herd's local Valkey (used by contributors developing this repo) is
      # 8.1.8 (docs/references.md); pin CI to the same minor line.
      valkey:
        image: valkey/valkey:8.1.8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # A second, separate server so the redis-marked suite also runs against real
      # Redis (not just Valkey). Exposed on 6390 to avoid clashing with valkey/6379.
      redis:
        image: redis:8.10.2
        ports:
          - 6390:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # Without python-version the cache key has no Python version; key it per image.
          cache-suffix: ${{ env.CLOUD_PYTHON_IMAGE }}
      - name: Pull the Cloud runtime image
        run: |
          for attempt in 1 2 3; do
            docker pull --quiet "$CLOUD_PYTHON_IMAGE" && exit 0
            echo "docker pull failed (attempt $attempt)" >&2
            sleep $((attempt * 10))
          done
          exit 1
      - name: Show the runtime fingerprint
        run: >-
          .github/scripts/cloud-python.sh sh -c
          'uname -m; cat /etc/debian_version; command -v python3; python3 -VV'
      - run: .github/scripts/cloud-python.sh uv sync --locked
      - name: Generate self-signed TLS certs for the TLS Valkey container
        run: |
          set -euo pipefail
          mkdir -p .ci-tls
          # Python 3.13+ enables VERIFY_X509_STRICT: the CA needs basicConstraints
          # and keyUsage, and the leaf needs a SAN (hostname checks ignore CN).
          printf '%s\n' \
            "subjectAltName=DNS:localhost,IP:127.0.0.1" \
            "basicConstraints=critical,CA:FALSE" \
            "keyUsage=critical,digitalSignature,keyEncipherment" \
            "extendedKeyUsage=serverAuth" \
            "subjectKeyIdentifier=hash" \
            "authorityKeyIdentifier=keyid,issuer" > .ci-tls/server.ext
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout .ci-tls/ca.key -out .ci-tls/ca.crt \
            -subj "/CN=laravel-cloud-queues-test-ca" \
            -addext "basicConstraints=critical,CA:TRUE" \
            -addext "keyUsage=critical,keyCertSign,cRLSign" \
            -addext "subjectKeyIdentifier=hash"
          openssl req -newkey rsa:2048 -nodes \
            -keyout .ci-tls/server.key -out .ci-tls/server.csr \
            -subj "/CN=localhost"
          openssl x509 -req -in .ci-tls/server.csr -CA .ci-tls/ca.crt -CAkey .ci-tls/ca.key \
            -CAcreateserial -out .ci-tls/server.crt -days 1 -extfile .ci-tls/server.ext
          # The Valkey image runs as a non-root user; the throwaway test key must be
          # readable inside the container.
          chmod 0644 .ci-tls/server.key

      - name: Start a TLS-only Valkey container
        run: |
          set -euo pipefail
          # Deliberately no --tls-ca-cert-file: Valkey/Redis append it to the
          # certificate chain they present to every client (verified locally with
          # `openssl s_client`), which trips strict OpenSSL 3.x chain validation
          # with "self-signed certificate in certificate chain" (verify code 19) in
          # redis-py. --tls-auth-clients no means the server never verifies client
          # certs, so it has no need for the CA file itself.
          docker run -d --name valkey-tls \
            -p 6380:6380 \
            -v "$PWD/.ci-tls:/tls:ro" \
            valkey/valkey:8.1.8 \
            --tls-port 6380 --port 0 \
            --tls-cert-file /tls/server.crt \
            --tls-key-file /tls/server.key \
            --tls-auth-clients no

      - name: Wait for the TLS Valkey container to accept connections
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            if docker exec valkey-tls valkey-cli --tls --cacert /tls/ca.crt \
                -p 6380 ping 2>/dev/null | grep -q PONG; then
              exit 0
            fi
            sleep 1
          done
          echo "TLS Valkey never became healthy" >&2
          docker logs valkey-tls >&2 || true
          exit 1

      - name: Run catalog conformance gate
        run: >-
          .github/scripts/cloud-python.sh uv run python -m tests.conformance
          --sqs localstack --report compatibility-report.json
      - name: Upload compatibility report and evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-artifacts
          if-no-files-found: warn
          path: |
            compatibility-report.json
            conformance-artifacts/**

  docs:
    # The Read the Docs site (docs/conf.py, .readthedocs.yaml): same install and a
    # warnings-as-errors build, so a broken page or cross-reference fails here first.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
      - run: uv sync --locked --no-dev --group docs --all-extras
      - run: uv run --no-sync sphinx-build -W --keep-going -b html docs docs/_build/html

  ci:
    if: always()
    needs: [lint, typecheck, docs, test, coverage, packaging, conformance]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all gates to pass
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more required jobs failed." >&2
          exit 1
