[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "laravel-cloud-queues"
version = "0.1.0"
description = "Laravel Cloud queues for Python: managed queues, plus SQS and Redis/Valkey on worker clusters, with a FastAPI adapter."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["laravel", "laravel-cloud", "queue", "sqs", "redis", "valkey", "fastapi", "worker"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AnyIO",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]
dependencies = [
    "anyio>=4.4",
    "boto3>=1.35",
    "httpx>=0.27",
    "typing-extensions>=4.12",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.121"]
redis = ["redis>=5.0"]
otel = ["opentelemetry-api>=1.27"]

[project.scripts]
laravel-cloud-queues = "laravel_cloud_queues.cli:main"

[dependency-groups]
dev = [
    "boto3-stubs[sqs]>=1.35",
    "fastapi>=0.121",
    "moto[server]>=5.0",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "pydantic>=2.7",
    "pytest>=8.3",
    "pytest-timeout>=2.3",
    "redis>=5.0",
    "ruff>=0.8",
    "ty>=0.0.84",
]

[tool.hatch.build.targets.wheel]
packages = ["src/laravel_cloud_queues"]

[tool.hatch.build.targets.sdist]
only-include = ["src/laravel_cloud_queues", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "."]
extend-exclude = ["probe-app", ".worktrees", "*.md"]

[tool.ruff.lint]
# ANN and PYI stand in for mypy --strict's annotation checks, which ty does not do
# (https://docs.astral.sh/ty/coming-from-mypy-or-pyright/).
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC", "PT", "PGH", "ANN", "PYI"]
ignore = ["RUF001", "RUF002", "RUF003", "ANN401"]

[tool.ruff.lint.per-file-ignores]
# Only shipped code (src/) and harness/ require full annotations.
"tests/**" = ["B011", "PT011", "PT018", "ANN"]
"demo/**" = ["ANN"]
".github/scripts/**" = ["ANN"]
# Proof worker deliberately blocks inside async code and polls; keep the scenarios literal.
"tests/runtime_proof/**" = ["ASYNC", "RUF046", "SIM105"]

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
include = ["src", "harness"]

[tool.ty.terminal]
error-on-warning = true

[tool.ty.rules]
# Strict set recommended in https://docs.astral.sh/ty/coming-from-mypy-or-pyright/.
dynamic-function-decorator-return = "error"
missing-type-argument = "error"
possibly-unresolved-reference = "warn"
unsound-return-statement = "error"
unused-ignore-comment = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]
timeout = 120
markers = [
    "agent: needs the local Laravel Cloud agent emulator",
    "sqs: needs an SQS endpoint (moto locally, LocalStack in CI)",
    "redis: needs a Redis/Valkey server",
    "socket: observability Unix socket tests",
    "subprocess: spawns real worker subprocesses",
    "runtime_proof: D2 timeout / watchdog runtime proofs",
    "packaging: builds and installs the wheel and sdist",
    "conformance: conformance catalog probes",
]
