[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "laravel-cloud-queues"
version = "0.2.0"
description = "Laravel Cloud queues for Python: managed queues, plus SQS and Redis/Valkey on worker clusters, with a FastAPI adapter."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["laravel", "laravel-cloud", "queue", "sqs", "redis", "valkey", "fastapi", "worker"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AnyIO",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]
dependencies = [
    "anyio>=4.4",
    "boto3>=1.35",
    "click>=8.2",
    "httpx>=0.27",
    "laravel-cloud-logging>=0.2.0",
    "typing-extensions>=4.12",
]

[project.urls]
Homepage = "https://github.com/DGarbs51/laravel-cloud-queues"
Documentation = "https://laravel-cloud-queues.readthedocs.io/"
Source = "https://github.com/DGarbs51/laravel-cloud-queues"
Issues = "https://github.com/DGarbs51/laravel-cloud-queues/issues"

[project.optional-dependencies]
fastapi = ["fastapi>=0.121"]
redis = ["redis>=5.0"]
otel = ["opentelemetry-api>=1.27"]

[project.scripts]
laravel-cloud-queues = "laravel_cloud_queues.cli:main"
lcq = "laravel_cloud_queues.cli:main"

[dependency-groups]
dev = [
    "boto3-stubs-lite[sqs]>=1.35",
    "coverage>=7.10",
    "fastapi>=0.121",
    "moto[server]>=5.0",
    "mypy>=1.18",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "pydantic>=2.7",
    "pyright[nodejs]>=1.1.400",
    "pytest>=8.3",
    "pytest-timeout>=2.3",
    "redis>=5.0",
    "ruff>=0.8",
    "ty>=0.0.84",
]
# Read the Docs and the CI docs job: `uv sync --group docs --all-extras`.
docs = [
    "furo>=2024.8.6",
    "myst-parser>=4.0",
    "sphinx>=8.1",
    "sphinx-copybutton>=0.5.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/laravel_cloud_queues"]

[tool.hatch.build.targets.sdist]
only-include = ["src/laravel_cloud_queues", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "."]
extend-exclude = [".worktrees", "*.md"]

[tool.ruff.lint]
# ANN and PYI stand in for mypy --strict's annotation checks, which ty does not do
# (https://docs.astral.sh/ty/coming-from-mypy-or-pyright/).
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC", "PT", "PGH", "ANN", "PYI"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Only shipped code (src/) and the test harness (tests/harness/) require full annotations.
# Explicit Any (ANN401) is banned in shipped code only.
"tests/**" = ["B011", "PT011", "PT018", "ANN401"]
"tests/{conformance,contract,docs,fixtures,integration,packaging,runtime_proof,typing,unit}/**" = ["ANN"]
"tests/harness/test_*.py" = ["ANN"]
"conftest.py" = ["ANN"]
".github/scripts/**" = ["ANN"]
# Proof worker deliberately blocks inside async code and polls; keep the scenarios literal.
"tests/runtime_proof/**" = ["ASYNC", "RUF046", "SIM105"]

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
include = ["src", "tests/harness"]

[tool.ty.terminal]
error-on-warning = true

[tool.ty.rules]
# Strict set recommended in https://docs.astral.sh/ty/coming-from-mypy-or-pyright/.
dynamic-function-decorator-return = "error"
missing-type-argument = "error"
possibly-unresolved-reference = "warn"
unsound-return-statement = "error"
unused-ignore-comment = "error"

# mypy --strict and pyright strict gate the shipped package only (src/laravel_cloud_queues);
# ty above still covers src and tests/harness. disallow_any_expr/disallow_any_decorated stay
# off: they flag every call into untyped third-party APIs (boto3, redis, FastAPI internals).
[tool.mypy]
python_version = "3.10"
files = ["src/laravel_cloud_queues"]
strict = true
disallow_any_explicit = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool", "possibly-undefined"]

[tool.pyright]
include = ["src/laravel_cloud_queues"]
pythonVersion = "3.10"
typeCheckingMode = "strict"
reportUnnecessaryTypeIgnoreComment = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]
timeout = 120
markers = [
    "agent: needs the local Laravel Cloud agent emulator",
    "sqs: needs an SQS endpoint (moto locally, LocalStack in CI)",
    "redis: needs a Redis/Valkey server",
    "socket: observability Unix socket tests",
    "subprocess: spawns real worker subprocesses",
    "runtime_proof: D2 timeout / watchdog runtime proofs",
    "packaging: builds and installs the wheel and sdist",
    "conformance: conformance catalog probes",
]

# 100% line and branch coverage of the shipped package, measured over the whole CI matrix:
# each test job uploads its data files and the `coverage` job combines them, since some
# branches only run on specific Python versions. patch = ["subprocess"] follows the real
# worker subprocesses the integration and runtime-proof suites spawn.
[tool.coverage.run]
source = ["laravel_cloud_queues"]
branch = true
parallel = true
patch = ["subprocess"]

[tool.coverage.paths]
source = ["src/laravel_cloud_queues", "*/site-packages/laravel_cloud_queues"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "@overload", "raise NotImplementedError", "\\.\\.\\.$"]
